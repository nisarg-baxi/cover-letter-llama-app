syntax = "proto3";

service LLMService {
  rpc Forward (ForwardRequest) returns (ForwardResponse);
  rpc HealthCheck (HealthRequest) returns (HealthResponse);
}

message ForwardRequest {
  repeated float activations = 1; // Flattened 2D tensor (batch * seq_len * hidden_dim)
  int32 batch = 2;
  int32 seq_len = 3;
  int32 hidden_dim = 4;
  repeated int32 attention_mask = 5;
  repeated int32 position_ids = 6;
}

message ForwardResponse {
  repeated float logits = 1; // Flattened 2D tensor (batch * seq_len * vocab_size)
  int32 batch = 2;
  int32 seq_len = 3;
  int32 vocab_size = 4;
  string message = 5;
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
} 